# Project name is set explicitly so it no longer depends on the directory basename.
# The deploy checkout and the dev checkout are both named "devops-lab", which made
# Compose treat them as one project. Override locally via COMPOSE_PROJECT_NAME in .env.
name: devops-lab

# One environment block for every service that runs application code. The migrate service
# and (from PR 2) the worker read the same settings; duplicating them is how they drift.
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MAX_TARGETS: ${MAX_TARGETS:-50}
  MIN_INTERVAL_SECONDS: ${MIN_INTERVAL_SECONDS:-30}
  SEED_TARGETS: ${SEED_TARGETS:-}

services:
  api:
    image: ghcr.io/hennifant/devops-lab-api:${IMAGE_TAG:-latest}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${API_PORT:-8000}:8000"
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /ready, not /health: this is what depends_on and the deployment smoke test gate
      # on, and it is the only one of the two that can tell whether the database answers.
      # The image's own HEALTHCHECK stays on /health, which asks the different question of
      # whether the container should be restarted.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # One-shot. Migrations run before the application starts, as their own service rather
  # than from an entrypoint: an entrypoint looks simpler and breaks the moment there is
  # more than one replica racing to apply the same revision.
  migrate:
    image: ghcr.io/hennifant/devops-lab-api:${IMAGE_TAG:-latest}
    # NOT ${RESTART_POLICY}. A one-shot service inheriting unless-stopped would run,
    # exit 0, be restarted, exit 0, and loop forever — while api's
    # depends_on: service_completed_successfully may never settle.
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: ${RESTART_POLICY:-unless-stopped}
    # Prometheus and Alertmanager have no authentication, so they stay on loopback.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    environment:
      # Compose does not hash bind mount contents, so a config-only change would not
      # recreate the container. The deploy writes a checksum here to force it.
      MONITORING_CONFIG_HASH: ${MONITORING_CONFIG_HASH:-dev}
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    environment:
      MONITORING_CONFIG_HASH: ${MONITORING_CONFIG_HASH:-dev}
    volumes:
      # Single file, not the directory: the notification secret will live in
      # monitoring/alertmanager/.env and must not be mounted into the container.
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:13.1.3
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  # A second process, and therefore a second failure surface: the API can serve traffic
  # while this is dead, and that has to be visible. Same image, different command — one
  # build, one artefact, ADR 0011 unchanged.
  worker:
    image: ghcr.io/hennifant/devops-lab-api:${IMAGE_TAG:-latest}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ["python", "-m", "app.worker"]
    # No ports: Prometheus reaches the metrics endpoint over the Compose network as
    # worker:9101. Publishing it would put an unauthenticated endpoint on the LAN.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-10}
      CHECK_TIMEOUT_SECONDS: ${CHECK_TIMEOUT_SECONDS:-10}
      CHECK_CONCURRENCY: ${CHECK_CONCURRENCY:-5}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Notification server. Unlike Prometheus and Alertmanager it has real authentication —
  # user login and per-application tokens — so it is the one monitoring service bound to
  # the LAN rather than loopback. Without that the phone cannot reach it. Once a tunnel
  # exists this should move back behind 127.0.0.1; see ADR 0014.
  gotify:
    image: gotify/server:3.0.0
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${GOTIFY_PORT:-8090}:80"
    environment:
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_ADMIN_PASSWORD:?GOTIFY_ADMIN_PASSWORD must be set}
    volumes:
      - gotify-data:/app/data

  # Alertmanager has no Gotify receiver and its webhook payload does not match Gotify's
  # message API, so this translates between them. No ports: only Alertmanager reaches it,
  # over the Compose network.
  gotify-bridge:
    image: druggeri/alertmanager_gotify_bridge:2.3.2
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      gotify:
        condition: service_started
    environment:
      GOTIFY_ENDPOINT: http://gotify:80/message
      GOTIFY_TOKEN: ${GOTIFY_TOKEN:-}

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  gotify-data:

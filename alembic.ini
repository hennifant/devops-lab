# Alembic is used for migrations only — no models, no autogenerate. See ADR 0012.
#
# There is deliberately no sqlalchemy.url here: the connection string carries credentials
# and this file is committed. alembic/env.py reads DATABASE_URL from the environment.
[alembic]
script_location = alembic
prepend_sys_path = .
# Without this Alembic falls back to splitting paths on spaces, commas and colons, and
# warns about it on every run.
path_separator = os
file_template = %%(rev)s_%%(slug)s

# Alembic's own logging is left at the defaults. The application configures structured
# logging in app.logging; the migrate container is short-lived and its output is a
# transcript of one command.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

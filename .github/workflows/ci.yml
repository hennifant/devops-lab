name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# One lane per ref. A superseded pull request run is cancelled — nobody needs results
# for a commit that has already been replaced. A main run is never cancelled: it may
# already be pushing layers to GHCR, and a half-pushed manifest is worse than a slow one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Stays on ubuntu-latest. This job runs on pull_request, anyone can open one against a
    # public repository, and the self-hosted runner has Docker socket access on the M2.
    runs-on: ubuntu-latest

    # The database tests bring their own Postgres rather than mocking one, so they
    # exercise the same migrations the deployment applies.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devops_test
      # Turns "no database" from a skip into a failure. Without it, a service container
      # that failed to start would leave the database suite silently unrun and the job green.
      REQUIRE_DB: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-lab-api:latest
            ghcr.io/${{ github.repository_owner }}/devops-lab-api:${{ github.sha }}

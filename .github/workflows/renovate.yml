name: Renovate

# Self-hosted Renovate: it runs here, in this repository's own Actions, rather than as
# the hosted Renovate GitHub App. No third party is granted access to the repository;
# the trade-off is that the credentials live here as RENOVATE_TOKEN.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        default: info
        type: choice
        options:
          - info
          - debug

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"

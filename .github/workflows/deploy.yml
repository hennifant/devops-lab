name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

# A single global lane — no github.ref in the group name. Deploys must serialise, so a
# running deploy is never cancelled. GitHub keeps at most one run queued per group: a
# third arrival cancels the queued one and takes its place, so the newest commit wins
# instead of every intermediate one being replayed onto the host.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    permissions:
      contents: read
      packages: read

    env:
      # The stack does not run from the runner workspace. actions/checkout cleans that
      # directory on every run, which replaces bind-mounted files and leaves running
      # containers pointing at deleted inodes.
      DEPLOY_DIR: /home/hennifant/deploy/devops-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync deployment directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete --exclude '.git' --exclude '.env' ./ "$DEPLOY_DIR/"

      - name: Write deployment environment
        run: |
          umask 077
          hash=$(find monitoring -type f -exec sha256sum {} + | sort | sha256sum | cut -c1-12)
          cat > "$DEPLOY_DIR/.env" <<EOF
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
          MONITORING_CONFIG_HASH=$hash
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          EOF

      - name: Deploy stack
        run: |
          cd "$DEPLOY_DIR"
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Show deployment status
        run: |
          cd "$DEPLOY_DIR"
          docker compose ps

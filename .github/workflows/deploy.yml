name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

# A single global lane — no github.ref in the group name. Deploys must serialise, so a
# running deploy is never cancelled. GitHub keeps at most one run queued per group: a
# third arrival cancels the queued one and takes its place, so the newest commit wins
# instead of every intermediate one being replayed onto the host.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Build once, deploy many. Both jobs deploy the *same* image, identified by the commit
  # SHA that CI built. Nothing is rebuilt between environments, so what is approved for
  # production is byte-for-byte what staging ran.
  staging:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    environment:
      name: staging
      url: http://127.0.0.1:28000

    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_DIR: /home/hennifant/deploy/devops-lab-stg
      COMPOSE_PROJECT: devops-lab-stg
      API_PORT: "28000"
      # Staging runs only the application under test. The monitoring stack is exercised by
      # production and would otherwise double the container count on a single host for no
      # additional signal.
      SERVICES: api db migrate
      # Self-referential on purpose: the seeded target points at the staging stack's own
      # /health, so the worker (PR 2) exercises the full path — worker → HTTP → database →
      # metrics — without adding outbound traffic from a host that also runs production.
      SEED_TARGETS: api-self=http://api:8000/health

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync deployment directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete --exclude '.git' --exclude '.env' ./ "$DEPLOY_DIR/"

      - name: Write deployment environment
        run: |
          umask 077
          hash=$(find monitoring -type f -exec sha256sum {} + | sort | sha256sum | cut -c1-12)
          cat > "$DEPLOY_DIR/.env" <<EOF
          COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
          MONITORING_CONFIG_HASH=$hash
          API_PORT=$API_PORT
          SEED_TARGETS=$SEED_TARGETS
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          # Compose interpolates the whole file even when only some services are
          # named, so the gotify block is resolved here too. A placeholder rather
          # than the real secret: staging never starts Gotify and has no business
          # holding production's password.
          GOTIFY_ADMIN_PASSWORD=unused-in-staging
          GOTIFY_TOKEN=
          EOF

      - name: Deploy
        run: |
          cd "$DEPLOY_DIR"
          docker compose pull $SERVICES
          # migrate is a dependency of api, so this blocks until it has exited zero.
          docker compose up -d $SERVICES

      - name: Seed
        run: |
          cd "$DEPLOY_DIR"
          if grep -qE '^SEED_TARGETS=.+' .env; then
            docker compose run --rm migrate python -m app.seed
          else
            echo "SEED_TARGETS is empty, nothing to seed"
          fi

      - name: Smoke test
        id: smoke
        run: |
          cd "$DEPLOY_DIR"
          ./scripts/smoke-test.sh "http://127.0.0.1:${API_PORT}" "smoke-${{ github.run_id }}"

      - name: Remove the smoke test target
        if: always()
        run: |
          id="${{ steps.smoke.outputs.target_id }}"
          [ -n "$id" ] || exit 0
          curl -fsS -X DELETE "http://127.0.0.1:${API_PORT}/api/targets/${id}" \
            && echo "removed smoke test target ${id}"

      - name: Show deployment status
        if: always()
        run: |
          cd "$DEPLOY_DIR"
          docker compose ps

  production:
    needs: staging
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    # Carries a required reviewer, so GitHub pauses here and waits for a human before the
    # job starts. This is the promotion gate.
    environment:
      name: production
      url: http://127.0.0.1:8000

    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_DIR: /home/hennifant/deploy/devops-lab
      COMPOSE_PROJECT: devops-lab
      API_PORT: "8000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync deployment directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete --exclude '.git' --exclude '.env' ./ "$DEPLOY_DIR/"

      - name: Write deployment environment
        run: |
          umask 077
          hash=$(find monitoring -type f -exec sha256sum {} + | sort | sha256sum | cut -c1-12)
          cat > "$DEPLOY_DIR/.env" <<EOF
          COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
          MONITORING_CONFIG_HASH=$hash
          API_PORT=$API_PORT
          # Deliberately empty. Production targets are created through the API by a human
          # and must persist; an unconditional seed would make the deployment an owner of
          # application data and resurrect anything deleted through the API.
          SEED_TARGETS=
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          GOTIFY_ADMIN_PASSWORD=${{ secrets.GOTIFY_ADMIN_PASSWORD }}
          GOTIFY_TOKEN=${{ secrets.GOTIFY_TOKEN }}
          EOF

      - name: Deploy
        run: |
          cd "$DEPLOY_DIR"
          docker compose pull
          # migrate is a dependency of api, so this blocks until it has exited zero.
          docker compose up -d --remove-orphans

      - name: Seed
        run: |
          cd "$DEPLOY_DIR"
          if grep -qE '^SEED_TARGETS=.+' .env; then
            docker compose run --rm migrate python -m app.seed
          else
            echo "SEED_TARGETS is empty, nothing to seed"
          fi

      - name: Smoke test
        id: smoke
        run: |
          cd "$DEPLOY_DIR"
          ./scripts/smoke-test.sh "http://127.0.0.1:${API_PORT}" "smoke-${{ github.run_id }}"

      - name: Remove the smoke test target
        if: always()
        run: |
          id="${{ steps.smoke.outputs.target_id }}"
          [ -n "$id" ] || exit 0
          curl -fsS -X DELETE "http://127.0.0.1:${API_PORT}/api/targets/${id}" \
            && echo "removed smoke test target ${id}"

      - name: Show deployment status
        if: always()
        run: |
          cd "$DEPLOY_DIR"
          docker compose ps

global:
  resolve_timeout: 5m

route:
  receiver: devops-lab

  group_by:
    - alertname
    - job

  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: devops-lab
    # The bridge translates this payload into a Gotify message. send_resolved matters:
    # without it you are told a thing broke and never told it recovered.
    webhook_configs:
      - url: http://gotify-bridge:8080/gotify_webhook
        send_resolved: true
